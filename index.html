<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarjeta de Presentación</title>
    <style>
      .container {
        border: 1.5px solid #000;
        border-radius: 1rem;
        margin: 2rem 0.5rem;
        padding: 1rem 1rem 3rem 1rem;
        text-align: center;
        font-size: 2rem;
        width: 20rem;
      }
      .mini-box {
        border: 1px solid #000;
        border-radius: 1rem;
        background-color: #facaec;
        margin: 0rem;
        padding: 2.5rem;
      }
      .mini-box-otro {
        border: 3px solid #facaec;
        border-radius: 1rem;
        background-color: #fff;
        margin: 2.5rem;
        padding: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="mini-box">ANDREINA</div>
      <div class="mini-box-otro">H O L A</div>
    </div>
  </body>
</html>
